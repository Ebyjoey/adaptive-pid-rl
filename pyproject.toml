[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-pid-rl"
version = "0.1.0"
description = "Adaptive PID Gain Scheduling Using Deep Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aby Joseph" }]

dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    "torch>=2.1",
    "mujoco>=3.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Pinned exactly (not >=) to match .github/workflows/ci.yml: an
    # unpinned ruff/mypy lets a new release change default lint/format
    # rules and silently diverge between a contributor's machine and CI.
    # Bump both together, intentionally, and re-run `ruff format .` first.
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[tool.setuptools]
packages = ["adaptive_pid"]

[tool.setuptools.package-dir]
"adaptive_pid" = "src/adaptive_pid"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that run full MuJoCo/SB3 simulations (deselect with '-m \"not slow\"')",
    "simulation: end-to-end simulation tests requiring MuJoCo",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
