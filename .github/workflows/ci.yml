name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Versions pinned deliberately: an unpinned `pip install ruff` lets
          # a new ruff release change default lint/format rules and break
          # this job on an otherwise-untouched codebase. Bump these
          # intentionally (and re-run `ruff format .` locally first) rather
          # than letting CI drift silently.
          pip install ruff==0.16.0 mypy==2.3.0
      - name: Ruff lint
        run: ruff check src/ training/ evaluation/ tests/ scripts/ ros2_ws/
      - name: Ruff format check
        run: ruff format --check src/ training/ evaluation/ tests/ scripts/ ros2_ws/
      - name: mypy (advisory, non-blocking)
        run: mypy src/adaptive_pid --ignore-missing-imports || true

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run fast unit tests (no MuJoCo simulation)
        run: pytest tests/unit -v --cov=adaptive_pid --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  simulation-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package (with MuJoCo)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run simulation tests (MuJoCo plant)
        run: pytest tests/simulation -v -m simulation
      - name: Run integration tests (full Gymnasium env)
        run: pytest tests/integration -v -m simulation

  training-smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-tests, simulation-and-integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke-test PPO training (tiny timestep budget, verifies the pipeline runs)
        run: python -m training.train_ppo --config configs/training/ppo.yaml --total-timesteps 2048 --n-envs 2
      - name: Smoke-test SAC training (tiny timestep budget)
        run: python -m training.train_sac --config configs/training/sac.yaml --total-timesteps 1000 --n-envs 1
      - name: Smoke-test the benchmark harness against baselines only
        run: python -m evaluation.benchmark --n-episodes 3 --skip-rl

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (build-only; ROS2/MuJoCo runtime verification is manual)
        run: docker build -f docker/Dockerfile -t adaptive-pid-rl:ci .
